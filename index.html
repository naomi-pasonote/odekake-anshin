<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おでかけ安心｜提出用サンプル</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;margin:0;background:#fff9fb;color:#332b2f}header{background:#e86a92;color:white;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.notice{background:#fff3c9;border:1px solid #ead28c;padding:12px 14px;border-radius:12px;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn,input{font:inherit;border:1px solid #e5cbd5;border-radius:10px;padding:10px}.btn{background:white;cursor:pointer}.btn.primary{background:#e86a92;color:white;border-color:#e86a92}.card{background:white;border:1px solid #efd9e1;border-radius:14px;padding:14px;margin:10px 0}.meta{font-size:12px;color:#7d6f74}.empty{text-align:center;padding:36px;border:1px dashed #e5cbd5;border-radius:14px;background:white;color:#7d6f74}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}.hidden{display:none}.panel{background:white;border-radius:16px;padding:18px;max-width:500px;width:100%}.panel label{display:block;margin-top:10px;font-size:13px}.panel input,.panel textarea{width:100%;box-sizing:border-box}.panel textarea{min-height:90px}.right{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
</style>
</head>
<body>
<header><h1 style="margin:0">おでかけ安心</h1><p style="margin:6px 0 0">忘れ物ゼロで、安心おでかけ</p></header>
<div class="wrap">
<div class="notice"><strong>提出用サンプル版です。</strong><br>個人データ・Firebase・Googleカレンダー等には接続していません。ここで入力した内容は、このブラウザ内だけに保存されます。</div>
<div class="toolbar"><input id="search" placeholder="予定を検索"><button id="add" class="btn primary">＋予定を追加</button></div>
<div id="list"></div>
</div>
<div id="modal" class="modal hidden"><div class="panel"><h2 id="title">予定を追加</h2><label>日付</label><input id="date" type="date"><label>予定名</label><input id="name" placeholder="例：買い物"><label>準備メモ</label><textarea id="memo" placeholder="持ち物・準備すること"></textarea><div class="right"><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">保存</button></div></div></div>
<script>
const KEY='odekakeAnshinPublicDemoV1';let items=[];let editing=null;const $=id=>document.getElementById(id);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const today=()=>new Date().toISOString().slice(0,10);function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}render()}function persist(){localStorage.setItem(KEY,JSON.stringify(items))}function render(){const q=$('search').value.trim().toLowerCase();const a=items.filter(x=>[x.date,x.name,x.memo].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.date.localeCompare(b.date));$('list').innerHTML=a.length?a.map(x=>`<div class="card"><div class="meta">${esc(x.date)}</div><strong>${esc(x.name)}</strong><p>${esc(x.memo)}</p><button class="btn" onclick="editItem('${x.id}')">編集</button> <button class="btn" onclick="delItem('${x.id}')">削除</button></div>`).join(''):'<div class="empty">予定はまだありません。<br>「＋予定を追加」からサンプル入力できます。</div>'}function openModal(x){editing=x?.id||null;$('date').value=x?.date||today();$('name').value=x?.name||'';$('memo').value=x?.memo||'';$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');editing=null}function editItem(id){openModal(items.find(x=>x.id===id))}function delItem(id){if(confirm('削除しますか？')){items=items.filter(x=>x.id!==id);persist();render()}}$('add').onclick=()=>openModal();$('cancel').onclick=closeModal;$('save').onclick=()=>{if(!$('date').value||!$('name').value.trim())return alert('日付と予定名を入力してください');const o={id:editing||uid(),date:$('date').value,name:$('name').value.trim(),memo:$('memo').value.trim()};const i=items.findIndex(x=>x.id===o.id);if(i>=0)items[i]=o;else items.push(o);persist();closeModal();render()};$('search').oninput=render;load();
</script>
</body>
</html>
